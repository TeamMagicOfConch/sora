server:
  servlet:
    session:
      cookie:
        same-site: ${COOKIE_SAME_SITE}

spring:
  application:
    name: soraAdmin

  ### for JPA
  jpa:
    properties:
      hibernate:
        generate_statistics: false
        show_sql: false
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO}
    generate-ddl: true

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    cache:
      channel:
        size: 25
      connection:
        mode: connection
        size: ${BATCH_PARTITION_GRID_SIZE:1}

rabbitmq:
  notification:
    exchange: ${RABBITMQ_NOTIFICATION_EXCHANGE}
    queue: ${RABBITMQ_NOTIFICATION_QUEUE}
    dlq: ${RABBITMQ_NOTIFICATION_DLQ}
    routing-key: ${RABBITMQ_NOTIFICATION_ROUTING_KEY}
    dlq-routing-key: ${RABBITMQ_NOTIFICATION_DLQ_ROUTING_KEY}

batch:
  partition:
    grid-size: ${BATCH_PARTITION_GRID_SIZE}

encryption:
  algorithm: AES
  transformation: AES/GCM/NoPadding
  key-size: 256
  iv-size: 12
  tag-length: 128
  secret: ${AES_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
